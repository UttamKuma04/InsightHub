services:
  backend:
    build:
      context: .
    environment:
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,.onrender.com
      CORS_ALLOWED_ORIGINS: https://insighthub-frontend.onrender.com,https://demo-project-eta-green.vercel.app
      USE_LOCAL_MEDIA_STORAGE: "True"
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
